kube-prometheus-stack:
  # CRDs are cluster-scoped and (as of the 67.x install) were created outside
  # Helm, so they have no release ownership and Helm would never upgrade them.
  # Enabling the chart's CRD upgrade job makes the pre-sync job apply the
  # 0.94.1 schemas and take ownership, which is required for the operator bump.
  crds:
    enabled: true
    upgradeJob:
      enabled: true
      forceConflicts: true
  grafana:
    enabled: true
    # The chart's default renders its own admin password with a helm `lookup`
    # that ArgoCD's offline template cannot satisfy, so every render minted a
    # new randAlphaNum 40: the Secret and the Deployment's checksum/secret
    # annotation churned on each sync and Grafana's hashed password stopped
    # matching the Secret. Point at the ksops-generated Secret instead — the
    # chart then stops rendering one entirely (see monitoring-admin/).
    admin:
      existingSecret: grafana-admin
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
    ingress:
      enabled: true
      ingressClassName: cilium
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - grafana.peterstorm.io
      tls:
        - hosts:
            - grafana.peterstorm.io
          secretName: grafana-tls
  alertmanager:
    enabled: true
  prometheus:
    prometheusSpec:
      # Durable history: a real PVC on the k3s local-path provisioner (same
      # class dotslash-dev uses), instead of emptyDir which wiped everything on
      # every Prometheus pod restart. local-path is thin-provisioned — the claim
      # reserves nothing until data is written. retentionSize is the real budget:
      # Prometheus self-deletes the oldest blocks once usage crosses 9Gi, so it
      # can never fill the node disk. Typical small-cluster ingest is
      # ~100-400MB/day → 9Gi ≈ 30-90 days of history. See also the append-only
      # token ledger in machines/desktop/default.nix, which outlives even this.
      retention: 30d
      # B suffix required (CRD regex): 9Gi is invalid, 9GiB is not.
      retentionSize: 9GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      replicas: 1
      # The local inference engines run outside the cluster. Port 8000 serves
      # whichever desktop-vllm model is active; 8001 stays wired for a future
      # second concurrent endpoint and reports down until one exists. Recording
      # rules normalize vLLM and SGLang names into the inference:* contract.
      additionalScrapeConfigs:
        - job_name: vllm-desktop
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["192.168.0.80:8000"]
              labels:
                instance: desktop:8000
            - targets: ["192.168.0.80:8001"]
              labels:
                instance: desktop:8001
  prometheusOperator:
    replicas: 1
