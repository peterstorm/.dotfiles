apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app: sonarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      initContainers:
        - name: migrate-paths
          image: alpine:3.21
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 30); do
                if apk add --no-cache sqlite > /dev/null 2>&1; then
                  break
                fi
                echo "sqlite install unavailable; retrying ($i/30)" >&2
                sleep 5
              done
              if ! command -v sqlite3 >/dev/null 2>&1; then
                echo "sqlite3 unavailable after retries; skipping non-critical path migration" >&2
                exit 0
              fi
              DB=/config/sonarr.db
              [ ! -f "$DB" ] && exit 0
              sqlite3 "$DB" "UPDATE RootFolders SET Path = REPLACE(Path, '/media/', '/data/media/') WHERE Path LIKE '/media/%';"
              sqlite3 "$DB" "UPDATE Series SET Path = REPLACE(Path, '/media/', '/data/media/') WHERE Path LIKE '/media/%';"
          volumeMounts:
            - name: config
              mountPath: /config
        - name: ensure-naming-config
          image: alpine:3.21
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 30); do
                if apk add --no-cache sqlite > /dev/null 2>&1; then
                  break
                fi
                echo "sqlite install unavailable; retrying ($i/30)" >&2
                sleep 5
              done
              if ! command -v sqlite3 >/dev/null 2>&1; then
                echo "sqlite3 unavailable after retries; skipping non-critical naming migration" >&2
                exit 0
              fi
              DB=/config/sonarr.db
              [ ! -f "$DB" ] && exit 0
              sqlite3 "$DB" "UPDATE NamingConfig SET RenameEpisodes = 1 WHERE Id = 1;"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: sonarr
          image: linuxserver/sonarr:4.0.19
          ports:
            - containerPort: 8989
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Copenhagen
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          hostPath:
            path: /var/data/configs/sonarr
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /var/data
            type: DirectoryOrCreate
