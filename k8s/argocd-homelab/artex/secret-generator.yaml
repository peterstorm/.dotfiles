apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: artex-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secrets.enc.yaml
  # Verbatim copy of dotslash-dev's encrypted pull secret — sops blobs are
  # key-encrypted, not namespace-locked. Rotation coupling: this blob and the
  # dotslash-dev original carry the same GHCR token; when it rotates,
  # re-encrypt BOTH (see also the plan's Gotchas) or one namespace keeps
  # pulling on a dead credential.
  - ghcr-pull-secret.enc.yaml
