name: build-artex-image

# Build the ARTEX pentest-harness image from the audited upstream checkout
# (BaaRai/ARTEX) and publish it to GHCR. WHAT is built is pinned by the
# checked-in build script (audited tag + full sha + clean worktree = the
# planted-code/backdoor audit bond; the identity lives ONLY in that script,
# which hands it to the publish steps via GITHUB_ENV). Beyond running it,
# this workflow adds: the runner's Docker data-root move onto /mnt, the GHCR
# login (GITHUB_TOKEN, packages: write), an OPTIONAL Docker Hub login
# (DOCKERHUB_USERNAME + DOCKERHUB_TOKEN — base-image pull rate limits), the
# tag/publish step and the provenance run summary.
#
# No GPU, no CUDA: standard runner is plenty (npm ci + go build + pinned tool
# downloads), so unlike the dflash2 workflows there is no swapfile step and no
# 30 GB reclaim; only the data-root move onto /mnt, since the image carries a
# browser+scanner toolbox and the runner rootfs is the small one.
# Manual trigger only: this is a SHA-pinned build, not something to run on
# every push.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the built image to GHCR"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-artex
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GHCR_REPO: ghcr.io/${{ github.repository_owner }}
      # Mapped from a secret so the step `if` can test it (secrets context is
      # not allowed directly in `if`). Empty when the secret is unset.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move Docker data-root to the larger /mnt volume
        run: |
          set -x
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          # The move must be observable: a stop that silently failed leaves
          # the daemon on the old root, and this step would lie about success
          # while the build slowly fills the small rootfs it was meant to spare.
          actual_root="$(docker info -f '{{ .DockerRootDir }}')"
          [ "$actual_root" = "/mnt/docker" ] || { echo "FAIL: docker data-root is $actual_root, expected /mnt/docker (did the stop/move actually take?)" >&2; exit 1; }
          echo "docker data-root: $actual_root"
          df -h / /mnt

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Optional Docker Hub login (avoids base-image pull rate limits)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + verify (reuses the checked-in build script)
        run: |
          bash scripts/artex/build-artex-image.sh
          df -h / /mnt

      - name: Tag + push to GHCR
        if: ${{ inputs.push }}
        run: |
          GHCR_IMAGE="$GHCR_REPO/${ARTX_LOCAL_IMAGE#*/}"
          echo "GHCR_IMAGE=$GHCR_IMAGE" >> "$GITHUB_ENV"
          docker tag "$ARTX_LOCAL_IMAGE" "$GHCR_IMAGE"
          docker push "$GHCR_IMAGE"
          echo "Published: $GHCR_IMAGE"
          docker inspect --format 'RepoDigests: {{json .RepoDigests}}' "$GHCR_IMAGE"

      - name: Summary
        if: ${{ inputs.push }}
        run: |
          {
            echo "## ARTEX image published"
            echo ""
            echo '```'
            echo "$GHCR_IMAGE"
            echo "provenance: BaaRai/ARTEX @ $ARTX_TAG ($ARTX_SHA)"
            docker inspect --format 'digest: {{index .RepoDigests 0}}' "$GHCR_IMAGE" 2>/dev/null || echo "digest: unavailable (inspect failed — the receipt must say so)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
