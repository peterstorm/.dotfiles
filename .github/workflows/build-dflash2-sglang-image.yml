name: build-dflash2-sglang-image

# Build the SGLang DFlash 2 engine image in GitHub Actions (no GPU needed —
# the build compiles CUDA/CUTLASS on CPU and the verification probe is
# import-only) and publish it to GHCR so the desktop can `docker pull` it
# instead of doing a 1-2 h from-source build locally.
#
# Source of truth for WHAT is built is the checked-in build script
# scripts/inference/qwen38/build-qwen38-dflash2-sglang-image.sh (it pins the
# PR #35371 merge commit c14312a6, uses SGLang's own Dockerfile stage
# `runtime`, and runs the DFlash2DraftModel/CandidateSelector/DFlashGroupedConv
# verification). This workflow only adds disk reclaim + registry publish.
#
# Manual trigger only: this is a heavy, SHA-pinned build, not something to run
# on every push.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the built image to GHCR"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dflash2-sglang
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # These images build from source; standard runners are 4 vCPU. SGLang uses
    # prebuilt sgl-kernel wheels (lighter than vLLM) but CUTLASS is still the
    # long pole. Bump `runs-on` to a larger runner if this approaches the cap.
    timeout-minutes: 350
    env:
      LOCAL_IMAGE: peterstorm/sglang:qwen38-dflash2-c14312a
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/sglang:qwen38-dflash2-c14312a
      # Mapped from a secret so the step `if` can test it (secrets context is
      # not allowed directly in `if`). Empty when the secret is unset.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim disk (CUDA images are tens of GB)
        run: |
          set -x
          # Delete preinstalled toolchains we do not use (~30 GB on ubuntu-latest).
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift || true
          # Move Docker's data-root onto the larger ephemeral /mnt volume so the
          # image + build cache do not exhaust the small root filesystem.
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          sudo docker image prune -af || true
          echo "--- disk after reclaim ---"
          df -h / /mnt

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Optional Docker Hub login (avoids base-image pull rate limits)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + verify (reuses the checked-in build script)
        run: |
          chmod +x scripts/inference/qwen38/build-qwen38-dflash2-sglang-image.sh
          bash scripts/inference/qwen38/build-qwen38-dflash2-sglang-image.sh
          df -h / /mnt

      - name: Tag + push to GHCR
        if: ${{ inputs.push }}
        run: |
          docker tag "$LOCAL_IMAGE" "$GHCR_IMAGE"
          docker push "$GHCR_IMAGE"
          echo "Published: $GHCR_IMAGE"
          docker inspect --format 'RepoDigests: {{json .RepoDigests}}' "$GHCR_IMAGE"

      - name: Summary
        if: ${{ inputs.push }}
        run: |
          {
            echo "## SGLang DFlash 2 image published"
            echo ""
            echo '```'
            echo "$GHCR_IMAGE"
            docker inspect --format 'digest: {{index .RepoDigests 0}}' "$GHCR_IMAGE" 2>/dev/null || true
            echo '```'
            echo ""
            echo "Pull on the desktop:"
            echo '```bash'
            echo "bash scripts/inference/qwen38/pull-qwen38-dflash2-images.sh sglang"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
